<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kick Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #08090d;
      color: #ffffff;
      font-family: 'Consolas', monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      pointer-events: none;
      z-index: 10;
    }
    .score-box { color: #00f3ff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.7); }
    .goal-box { color: #ffbe0b; text-shadow: 0 0 10px rgba(255, 190, 11, 0.5); }

    canvas {
      display: block;
      background: #0e1017;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 7, 9, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
    }
    .overlay h2 {
      font-size: 2.2rem;
      color: #00f3ff;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.8);
    }
    .btn-action {
      background: transparent;
      color: #ffffff;
      border: 1px solid #00f3ff;
      padding: 10px 24px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #00f3ff;
      color: #050608;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="score-box">ПНУТО: <span id="valScore">0</span></div>
    <div class="goal-box">ЦЕЛЬ: 100</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="overlay" id="screenWin" style="display: none;">
    <h2>ПОБЕДА! ПЛАН ВЫПОЛНЕН!</h2>
    <p>100 объектов успешно ликвидированы.</p>
    <button class="btn-action" id="btnRestart">ЕЩЁ СМЕНУ</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const valScore = document.getElementById('valScore');
    const screenWin = document.getElementById('screenWin');
    const btnRestart = document.getElementById('btnRestart');

    // Загрузка локального изображения
    const targetImg = new Image();
    targetImg.src = 'target.png';

    const TARGET_CONFIG = {
      width: 44,        // Ширина картинки на карте
      height: 44,       // Высота картинки на карте
      hitRadius: 32     // Радиус срабатывания пинка
    };

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let isRunning = true;
    const MAX_TARGETS = 5;
    const WIN_SCORE = 100;

    // Человечек-игрок
    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 18,
      speed: 4.8,
      angle: 0,
      walkFrame: 0,
      isMoving: false,
      // Состояние удара ногой
      kicking: false,
      kickPhase: 0,
      kickTargetIndex: -1
    };

    const targets = [];
    const particles = [];

    // Управление
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    let pointer = { x: player.x, y: player.y, active: false };
    window.addEventListener('pointerdown', e => {
      pointer.active = true;
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    });
    window.addEventListener('pointermove', e => {
      if (pointer.active) {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
      }
    });
    window.addEventListener('pointerup', () => pointer.active = false);

    function spawnTarget() {
      const margin = 60;
      targets.push({
        x: margin + Math.random() * (canvas.width - margin * 2),
        y: margin + Math.random() * (canvas.height - margin * 2)
      });
    }

    while (targets.length < MAX_TARGETS) spawnTarget();

    // Компактный аккуратный разлёт осколков прямо на месте
    function shatterCompact(x, y) {
      for (let i = 0; i < 9; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1.0 + Math.random() * 1.8; // Очень маленькая скорость
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2 + Math.random() * 2.5,
          life: 14, // Быстро растворяются
          color: Math.random() > 0.4 ? '#ff1e42' : '#ffffff'
        });
      }
    }

    function update() {
      if (!isRunning) return;

      let dx = 0;
      let dy = 0;

      // Если сейчас идет фаза удара — игрок кратковременно замирает для акцента
      if (!player.kicking) {
        if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
        if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) dy += 1;

        if (pointer.active) {
          const pdx = pointer.x - player.x;
          const pdy = pointer.y - player.y;
          const dist = Math.hypot(pdx, pdy);
          if (dist > 12) {
            dx = pdx / dist;
            dy = pdy / dist;
          }
        }

        if (dx !== 0 || dy !== 0) {
          const len = Math.hypot(dx, dy);
          player.x += (dx / len) * player.speed;
          player.y += (dy / len) * player.speed;
          player.angle = Math.atan2(dy, dx);
          player.walkFrame += 0.2;
          player.isMoving = true;
        } else {
          player.isMoving = false;
        }

        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

        // Поиск цели для пинка
        for (let i = 0; i < targets.length; i++) {
          const t = targets[i];
          const dist = Math.hypot(t.x - player.x, t.y - player.y);

          if (dist < player.radius + TARGET_CONFIG.hitRadius) {
            // Начинаем анимацию пинка
            player.kicking = true;
            player.kickPhase = 0;
            player.kickTargetIndex = i;
            player.angle = Math.atan2(t.y - player.y, t.x - player.x);
            break;
          }
        }
      } else {
        // Процесс пинка ногой
        player.kickPhase += 0.22;

        // В кульминации удара объект разлетается
        if (player.kickPhase >= 1.0 && player.kickTargetIndex !== -1) {
          const t = targets[player.kickTargetIndex];
          if (t) {
            shatterCompact(t.x, t.y);
            targets.splice(player.kickTargetIndex, 1);
            score++;
            valScore.textContent = score;

            if (score >= WIN_SCORE) {
              winGame();
              return;
            }
            spawnTarget();
          }
          player.kickTargetIndex = -1;
        }

        // Завершение анимации ноги
        if (player.kickPhase >= Math.PI) {
          player.kicking = false;
          player.kickPhase = 0;
        }
      }

      // Частицы
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // Отрисовка детализированного человечка с ногами и руками
    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);

      const walk = player.isMoving ? Math.sin(player.walkFrame) * 6 : 0;

      // Вынос ноги вперед при пинке
      let kickOffset = 0;
      if (player.kicking) {
        kickOffset = Math.sin(player.kickPhase) * 28; // Нога вытягивается далеко вперед
      }

      // 1. Ноги (ботинки)
      ctx.fillStyle = '#ff1e42';
      // Правая (бьющая) нога
      ctx.beginPath();
      ctx.ellipse(8 + kickOffset, 10 + (player.kicking ? 0 : walk), 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Левая (опорная) нога
      ctx.fillStyle = '#b3102c';
      ctx.beginPath();
      ctx.ellipse(8, -10 - walk, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // 2. Руки с кулаками
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(10, 16 + (player.kicking ? 8 : -walk), 4, 0, Math.PI * 2);
      ctx.arc(10, -16 + (player.kicking ? -4 : walk), 4, 0, Math.PI * 2);
      ctx.fill();

      // 3. Плечи и тело (одежда)
      ctx.fillStyle = '#1e2230';
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      // Воротник / куртка
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-6, -4, 8, 8);

      // 4. Голова
      ctx.fillStyle = '#f7c59f';
      ctx.beginPath();
      ctx.arc(2, 0, 9, 0, Math.PI * 2);
      ctx.fill();

      // Волосы
      ctx.fillStyle = '#141419';
      ctx.beginPath();
      ctx.arc(-2, 0, 9, Math.PI * 0.5, Math.PI * 1.5);
      ctx.fill();

      // Глаза (смотрят в сторону удара)
      ctx.fillStyle = '#0a0b10';
      ctx.beginPath();
      ctx.arc(7, -3, 2, 0, Math.PI * 2);
      ctx.arc(7, 3, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Сетка пола
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gSize = 40;
      for (let x = 0; x < canvas.width; x += gSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Цели
      ctx.font = `${TARGET_CONFIG.size}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      targets.forEach(t => {
        ctx.fillText(TARGET_CONFIG.displayChar, t.x, t.y);
      });

      // Компактные частицы
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Игрок
      drawPlayer();
    }

    function loop() {
      update();
      draw();
      if (isRunning) requestAnimationFrame(loop);
    }

    function winGame() {
      isRunning = false;
      screenWin.style.display = 'flex';
    }

    function restart() {
      score = 0;
      targets.length = 0;
      particles.length = 0;
      while (targets.length < MAX_TARGETS) spawnTarget();
      valScore.textContent = '0';
      screenWin.style.display = 'none';
      isRunning = true;
      loop();
    }

    btnRestart.addEventListener('click', restart);
    loop();
  </script>
</body>
</html>
