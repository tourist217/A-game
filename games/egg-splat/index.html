<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Обучение по Адвант шоп</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #14171f;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: crosshair;
    }

    /* Холст стены */
    canvas {
      display: block;
      position: absolute;
      inset: 0;
    }

    /* Кнопка смыва */
    .btn-clean {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(10, 12, 18, 0.85);
      color: #00f3ff;
      border: 1px solid #00f3ff;
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
      transition: all 0.2s;
      z-index: 20;
    }
    .btn-clean:hover {
      background: #00f3ff;
      color: #050608;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.7);
    }

    /* Визуальный объект швабры для анимации очистки */
    .mop {
      position: absolute;
      top: 0;
      left: -120px;
      width: 90px;
      height: 100vh;
      background: linear-gradient(90deg, rgba(0, 243, 255, 0.5), rgba(255, 255, 255, 0.9));
      box-shadow: 10px 0 25px rgba(0, 243, 255, 0.8);
      pointer-events: none;
      z-index: 15;
      display: none;
    }
  </style>
</head>
<body>
  <div class="mop" id="mop"></div>
  <button class="btn-clean" id="btnClean">🧽 ВЫМЫТЬ СТЕНУ</button>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const btnClean = document.getElementById('btnClean');
    const mop = document.getElementById('mop');

    // Оффлайн-холст для запекания засохших следов (чтобы не просаживать FPS при тысячах яиц)
    const wallCanvas = document.createElement('canvas');
    const wallCtx = wallCanvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      wallCanvas.width = canvas.width;
      wallCanvas.height = canvas.height;
      drawBackgroundWall();
    }

    // Текстура стены и надпись
    function drawBackgroundWall() {
      // Бетонная кирпичная стена
      wallCtx.fillStyle = '#161922';
      wallCtx.fillRect(0, 0, wallCanvas.width, wallCanvas.height);

      // Сетка кирпичей
      wallCtx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      wallCtx.lineWidth = 2;
      const bH = 50;
      const bW = 100;
      for (let y = 0; y < wallCanvas.height; y += bH) {
        const offset = (y / bH) % 2 === 0 ? 0 : bW / 2;
        for (let x = -offset; x < wallCanvas.width; x += bW) {
          wallCtx.strokeRect(x, y, bW, bH);
        }
      }

      // Надпись
      const fontSize = Math.max(26, Math.min(canvas.width / 18, 54));
      wallCtx.font = `900 ${fontSize}px sans-serif`;
      wallCtx.textAlign = 'center';
      wallCtx.textBaseline = 'middle';

      const textPart1 = 'Обучение по ';
      const textPart2 = 'Адвант шоп';
      const totalWidth = wallCtx.measureText(textPart1 + textPart2).width;
      const startX = (canvas.width - totalWidth) / 2;
      const centerY = canvas.height * 0.38;

      const w1 = wallCtx.measureText(textPart1).width;

      wallCtx.lineWidth = Math.max(5, fontSize / 7);
      wallCtx.strokeStyle = '#ffffff'; // Белая обводка всего текста
      wallCtx.lineJoin = 'round';

      // Обводка
      wallCtx.strokeText(textPart1, startX + w1 / 2, centerY);
      wallCtx.strokeText(textPart2, startX + w1 + wallCtx.measureText(textPart2).width / 2, centerY);

      // Заливка
      wallCtx.fillStyle = '#000000';
      wallCtx.fillText(textPart1, startX + w1 / 2, centerY);

      wallCtx.fillStyle = '#0066ff'; // Синий цвет «Адвант шоп»
      wallCtx.fillText(textPart2, startX + w1 + wallCtx.measureText(textPart2).width / 2, centerY);
    }

    window.addEventListener('resize', resize);
    resize();

    // Массивы летящих объектов и активных анимаций
    const flyingEggs = [];
    const drippingSplats = [];
    const shellParticles = [];

    // Запуск яйца по клику
    function throwEgg(targetX, targetY) {
      const startX = canvas.width / 2 + (Math.random() * 200 - 100);
      const startY = canvas.height + 40;

      flyingEggs.push({
        x: startX,
        y: startY,
        startX: startX,
        startY: startY,
        targetX: targetX,
        targetY: targetY,
        progress: 0,
        speed: 0.05 + Math.random() * 0.02
      });
    }

    // Создание кляксы в точке удара
    function createSplat(x, y) {
      // Осколки скорлупы
      for (let i = 0; i < 9; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = 2 + Math.random() * 5;
        shellParticles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * vel,
          vy: Math.sin(angle) * vel,
          size: 3 + Math.random() * 4,
          life: 25 + Math.random() * 15
        });
      }

      // Стекающее яйцо
      drippingSplats.push({
        x: x,
        y: y,
        dripY: 0,
        maxDrip: 15 + Math.random() * 18,
        radius: 18 + Math.random() * 8,
        done: false
      });
    }

    // Игровой цикл
    function update() {
      // 1. Полет яиц к стене
      for (let i = flyingEggs.length - 1; i >= 0; i--) {
        const e = flyingEggs[i];
        e.progress += e.speed;
        e.x = e.startX + (e.targetX - e.startX) * e.progress;
        e.y = e.startY + (e.targetY - e.startY) * e.progress;

        if (e.progress >= 1) {
          createSplat(e.targetX, e.targetY);
          flyingEggs.splice(i, 1);
        }
      }

      // 2. Частицы скорлупы
      for (let i = shellParticles.length - 1; i >= 0; i--) {
        const p = shellParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25; // Гравитация
        p.life--;
        if (p.life <= 0) shellParticles.splice(i, 1);
      }

      // 3. Стекание желтка и запекание на стену
      for (let i = drippingSplats.length - 1; i >= 0; i--) {
        const s = drippingSplats[i];
        s.dripY += 0.45;

        if (s.dripY >= s.maxDrip) {
          // Запекаем кляксу на стену навсегда
          bakeSplatToWall(s.x, s.y, s.dripY, s.radius);
          drippingSplats.splice(i, 1);
        }
      }
    }

    // Отрисовка кляксы в постоянный холст
    function bakeSplatToWall(x, y, dripY, radius) {
      // Белок (прозрачный матовый след)
      wallCtx.fillStyle = 'rgba(240, 240, 220, 0.45)';
      wallCtx.beginPath();
      wallCtx.ellipse(x, y + dripY * 0.4, radius * 1.5, radius * 1.2 + dripY * 0.5, 0, 0, Math.PI * 2);
      wallCtx.fill();

      // Капля подтека
      wallCtx.fillStyle = 'rgba(255, 185, 0, 0.85)';
      wallCtx.beginPath();
      wallCtx.ellipse(x, y + dripY, radius * 0.45, radius * 0.6, 0, 0, Math.PI * 2);
      wallCtx.fill();

      // Желток
      wallCtx.fillStyle = '#ffaa00';
      wallCtx.beginPath();
      wallCtx.arc(x, y + dripY * 0.5, radius * 0.7, 0, Math.PI * 2);
      wallCtx.fill();

      // Блик на желтке
      wallCtx.fillStyle = '#ffffff';
      wallCtx.beginPath();
      wallCtx.arc(x - radius * 0.25, y + dripY * 0.5 - radius * 0.2, radius * 0.18, 0, Math.PI * 2);
      wallCtx.fill();
    }

    function render() {
      // Отрисовываем стену с уже засохшими яйцами
      ctx.drawImage(wallCanvas, 0, 0);

      // Отрисовываем текущие стекающие яйца
      drippingSplats.forEach(s => {
        // Белок
        ctx.fillStyle = 'rgba(240, 240, 220, 0.5)';
        ctx.beginPath();
        ctx.ellipse(s.x, s.y + s.dripY * 0.4, s.radius * 1.4, s.radius * 1.1 + s.dripY * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Желток
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath();
        ctx.arc(s.x, s.y + s.dripY * 0.5, s.radius * 0.7, 0, Math.PI * 2);
        ctx.fill();

        // Струйка
        ctx.fillStyle = 'rgba(255, 170, 0, 0.85)';
        ctx.beginPath();
        ctx.ellipse(s.x, s.y + s.dripY, s.radius * 0.4, s.radius * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // Отрисовка осколков скорлупы
      ctx.fillStyle = '#f5eedb';
      shellParticles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Отрисовка летящих яиц
      flyingEggs.forEach(e => {
        const scale = 0.5 + e.progress * 0.5;
        ctx.fillStyle = '#faecc8';
        ctx.beginPath();
        ctx.ellipse(e.x, e.y, 14 * scale, 18 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(() => {
        update();
        render();
      });
    }

    render();

    // Клик бросает яйцо
    window.addEventListener('pointerdown', (e) => {
      if (e.target === btnClean) return;
      throwEgg(e.clientX, e.clientY);
    });

    // Анимация швабры и смыв
    let isCleaning = false;
    btnClean.addEventListener('click', () => {
      if (isCleaning) return;
      isCleaning = true;

      mop.style.display = 'block';
      let pos = -120;

      function sweep() {
        pos += 22;
        mop.style.left = `${pos}px`;

        if (pos > canvas.width + 120) {
          mop.style.display = 'none';
          drawBackgroundWall(); // Полная очистка холста до исходного
          isCleaning = false;
        } else {
          requestAnimationFrame(sweep);
        }
      }

      sweep();
    });
  </script>
</body>
</html>
