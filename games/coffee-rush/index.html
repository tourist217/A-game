<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Racer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #08090d;
      color: #ffffff;
      font-family: 'Consolas', monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      pointer-events: none;
      z-index: 10;
    }
    .score-box { color: #00f3ff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.7); }
    .lives-box { color: #ff1e42; text-shadow: 0 0 10px rgba(255, 30, 66, 0.7); }

    canvas {
      display: block;
      background: #11131a;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 7, 9, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
    }
    .overlay h2 {
      font-size: 2.2rem;
      color: #ff1e42;
      text-shadow: 0 0 15px rgba(255, 30, 66, 0.8);
    }
    .overlay p { color: #8e95a5; font-size: 0.95rem; }
    .btn-action {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ff1e42;
      padding: 10px 24px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(255, 30, 66, 0.4);
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #ff1e42;
      box-shadow: 0 0 20px rgba(255, 30, 66, 0.8);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="score-box">ОЧКИ: <span id="valScore">0</span></div>
    <div class="lives-box">ЖИЗНИ: <span id="valLives">❤❤❤</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="overlay" id="screenGameOver" style="display: none;">
    <h2>АВАРИЯ!</h2>
    <p>Сбиты красные сотрудники. Заезд завершен.</p>
    <p style="color: #00f3ff;">Финальный счет: <span id="valFinalScore">0</span></p>
    <button class="btn-action" id="btnRestart">ВЫЕХАТЬ СНОВА</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const valScore = document.getElementById('valScore');
    const valLives = document.getElementById('valLives');
    const screenGameOver = document.getElementById('screenGameOver');
    const valFinalScore = document.getElementById('valFinalScore');
    const btnRestart = document.getElementById('btnRestart');

    function resize() {
      canvas.width = Math.min(window.innerWidth, 500);
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Параметры геймплея
    let score = 0;
    let lives = 3;
    let isRunning = true;
    let baseSpeed = 2.2; // Снизили стартовую скорость для комфортного старта
    let roadOffset = 0;
    let spawnCounter = 0;

    // Машина игрока
    const car = {
      w: 42,
      h: 74,
      x: canvas.width / 2 - 21,
      y: canvas.height - 110,
      speed: 5.5
    };

    const pedestrians = [];
    const bloodSplatters = [];
    const particles = [];

    // Управление клавиатурой
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Управление мышью и пальцем
    let isPointerDown = false;
    window.addEventListener('pointerdown', e => {
      isPointerDown = true;
      moveCarToPointer(e);
    });
    window.addEventListener('pointermove', e => {
      if (isPointerDown) moveCarToPointer(e);
    });
    window.addEventListener('pointerup', () => isPointerDown = false);

    function moveCarToPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const targetX = e.clientX - rect.left - car.w / 2;
      car.x += (targetX - car.x) * 0.18;
    }

    function spawnPedestrian() {
      const isTarget = Math.random() > 0.45; // Синий (сбивать) или Красный (объезжать)
      pedestrians.push({
        x: 35 + Math.random() * (canvas.width - 70 - 28),
        y: -60,
        w: 28,
        h: 34,
        isTarget: isTarget,
        animFrame: Math.random() * 10
      });
    }

    // Эффект раздавливания: пятно на асфальте и разлетающиеся брызги
    function crushPedestrian(p) {
      const color = p.isTarget ? '#0066ff' : '#ff1e42';

      // Пятно на асфальте
      bloodSplatters.push({
        x: p.x + p.w / 2,
        y: p.y + p.h / 2,
        radius: 18 + Math.random() * 8,
        color: color
      });

      // Разлетающиеся частицы
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 5;
        particles.push({
          x: p.x + p.w / 2,
          y: p.y + p.h / 2,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2 + Math.random() * 4,
          life: 25,
          color: color
        });
      }
    }

    function update() {
      if (!isRunning) return;

      // Плавный разгон каждые 10 очков
      const currentSpeed = baseSpeed + Math.floor(score / 10) * 0.4;
      roadOffset = (roadOffset + currentSpeed) % 40;

      // Движение клавиатурой
      if (keys['KeyA'] || keys['ArrowLeft']) car.x -= car.speed;
      if (keys['KeyD'] || keys['ArrowRight']) car.x += car.speed;
      if (keys['KeyW'] || keys['ArrowUp']) car.y -= car.speed * 0.7;
      if (keys['KeyS'] || keys['ArrowDown']) car.y += car.speed * 0.7;

      // Границы трассы
      car.x = Math.max(16, Math.min(canvas.width - car.w - 16, car.x));
      car.y = Math.max(50, Math.min(canvas.height - car.h - 20, car.y));

      // Спавн человечков
      spawnCounter++;
      const spawnRate = Math.max(45, 95 - Math.floor(score / 10) * 5);
      if (spawnCounter > spawnRate) {
        spawnPedestrian();
        spawnCounter = 0;
      }

      // Обновление пятен на асфальте (едут вниз со скоростью дороги)
      for (let i = bloodSplatters.length - 1; i >= 0; i--) {
        const s = bloodSplatters[i];
        s.y += currentSpeed;
        if (s.y > canvas.height + 60) bloodSplatters.splice(i, 1);
      }

      // Обновление брызг
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      // Обновление пешеходов и коллизий
      for (let i = pedestrians.length - 1; i >= 0; i--) {
        const p = pedestrians[i];
        p.y += currentSpeed;
        p.animFrame += 0.15;

        // Коллизия с машиной
        if (
          car.x < p.x + p.w &&
          car.x + car.w > p.x &&
          car.y < p.y + p.h &&
          car.y + car.h > p.y
        ) {
          crushPedestrian(p);

          if (p.isTarget) {
            // Синий - сбиваем, начисляем очки
            score += 10;
            valScore.textContent = score;
          } else {
            // Красный - штраф
            lives--;
            valLives.textContent = '❤'.repeat(Math.max(0, lives));
            if (lives <= 0) {
              gameOver();
              return;
            }
          }

          pedestrians.splice(i, 1);
          continue;
        }

        if (p.y > canvas.height + 50) pedestrians.splice(i, 1);
      }
    }

    function drawHuman(p) {
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      const legWobble = Math.sin(p.animFrame) * 3;

      // Ноги
      ctx.strokeStyle = '#222634';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx - 5, cy + 8);
      ctx.lineTo(cx - 5, cy + 16 + legWobble);
      ctx.moveTo(cx + 5, cy + 8);
      ctx.lineTo(cx + 5, cy + 16 - legWobble);
      ctx.stroke();

      // Руки
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy - 2);
      ctx.lineTo(cx - 12, cy + 6 - legWobble);
      ctx.moveTo(cx + 10, cy - 2);
      ctx.lineTo(cx + 12, cy + 6 + legWobble);
      ctx.stroke();

      // Туловище (одежда)
      ctx.fillStyle = '#1c202d';
      ctx.fillRect(cx - 8, cy - 6, 16, 15);

      // Голова
      ctx.fillStyle = '#ffd1b3';
      ctx.beginPath();
      ctx.arc(cx, cy - 10, 6, 0, Math.PI * 2);
      ctx.fill();

      // Буква «А» на спине/груди
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff'; // Белая обводка
      ctx.strokeText('A', cx, cy);

      ctx.fillStyle = p.isTarget ? '#0066ff' : '#ff1e42'; // Синий или Красный
      ctx.fillText('A', cx, cy);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Асфальт
      ctx.fillStyle = '#0f1118';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Обочины
      ctx.fillStyle = '#ff1e42';
      ctx.fillRect(0, 0, 8, canvas.height);
      ctx.fillRect(canvas.width - 8, 0, 8, canvas.height);

      // Прерывистая разметка
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -roadOffset;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // 2. Раздавленные пятна на асфальте
      bloodSplatters.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.globalAlpha = 0.65;
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.radius, s.radius * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // 3. Брызги от удара
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // 4. Человечки
      pedestrians.forEach(p => drawHuman(p));

      // 5. Машина игрока
      // Корпус
      ctx.fillStyle = '#ff1e42';
      ctx.shadowColor = 'rgba(255, 30, 66, 0.6)';
      ctx.shadowBlur = 10;
      ctx.fillRect(car.x, car.y, car.w, car.h);
      ctx.shadowBlur = 0;

      // Лобовое стекло
      ctx.fillStyle = '#00f3ff';
      ctx.fillRect(car.x + 5, car.y + 16, car.w - 10, 14);

      // Фары
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(car.x + 4, car.y + 2, 7, 4);
      ctx.fillRect(car.x + car.w - 11, car.y + 2, 7, 4);

      // Колеса
      ctx.fillStyle = '#000000';
      ctx.fillRect(car.x - 3, car.y + 10, 4, 14);
      ctx.fillRect(car.x + car.w - 1, car.y + 10, 4, 14);
      ctx.fillRect(car.x - 3, car.y + car.h - 22, 4, 14);
      ctx.fillRect(car.x + car.w - 1, car.y + car.h - 22, 4, 14);
    }

    function loop() {
      update();
      draw();
      if (isRunning) requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      valFinalScore.textContent = score;
      screenGameOver.style.display = 'flex';
    }

    function restart() {
      score = 0;
      lives = 3;
      pedestrians.length = 0;
      bloodSplatters.length = 0;
      particles.length = 0;
      car.x = canvas.width / 2 - car.w / 2;
      car.y = canvas.height - 110;
      valScore.textContent = '0';
      valLives.textContent = '❤❤❤';
      screenGameOver.style.display = 'none';
      isRunning = true;
      loop();
    }

    btnRestart.addEventListener('click', restart);
    loop();
  </script>
</body>
</html>
