<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Бросок яйца в стену</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      color: #eee;
      user-select: none;
      overflow: hidden;
    }
    canvas {
      border: 3px solid #444;
      background: #87CEEB; /* Небо */
      cursor: crosshair;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    p { margin-top: 10px; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <p>Кликайте мышкой по стене, чтобы бросать яйца!</p>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Параметры стены
    const wall = {
      x: 250,
      y: 100,
      w: 300,
      h: 300,
      part1: "Обучение по ",
      part2: "Адвант Шоп"
    };

    const eggs = [];
    const splats = [];   // Статичные аккуратные кляксы
    const shards = [];   // Осколки скорлупы

    // Обработка клика
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const targetX = e.clientX - rect.left;
      const targetY = e.clientY - rect.top;

      const startX = canvas.width / 2;
      const startY = canvas.height - 20;

      const dx = targetX - startX;
      const dy = targetY - startY;
      const distance = Math.hypot(dx, dy);
      const speed = 16;

      eggs.push({
        x: startX,
        y: startY,
        vx: (dx / distance) * speed,
        vy: (dy / distance) * speed,
        targetX: targetX,
        targetY: targetY
      });
    });

    // Рисование кирпичной стены
    function drawWall() {
      ctx.fillStyle = '#b2533e';
      ctx.fillRect(wall.x, wall.y, wall.w, wall.h);

      // Кирпичные швы
      ctx.strokeStyle = '#7c2f20';
      ctx.lineWidth = 2;
      const rowH = 20;
      const colW = 40;
      for (let y = wall.y; y < wall.y + wall.h; y += rowH) {
        ctx.beginPath();
        ctx.moveTo(wall.x, y);
        ctx.lineTo(wall.x + wall.w, y);
        ctx.stroke();

        const offset = ((y - wall.y) / rowH) % 2 === 0 ? 0 : colW / 2;
        for (let x = wall.x + offset; x < wall.x + wall.w; x += colW) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, Math.min(y + rowH, wall.y + wall.h));
          ctx.stroke();
        }
      }

      // Карниз
      ctx.fillStyle = '#444';
      ctx.fillRect(wall.x - 10, wall.y - 10, wall.w + 20, 10);

      // Надпись
      ctx.save();
      ctx.font = 'bold 22px Arial, sans-serif';
      ctx.translate(wall.x + wall.w / 2, wall.y + wall.h / 2);
      ctx.rotate(-0.05);

      const width1 = ctx.measureText(wall.part1).width;
      const width2 = ctx.measureText(wall.part2).width;
      const totalWidth = width1 + width2;
      const startX = -totalWidth / 2;

      ctx.textAlign = 'left';

      // Белая окантовка текста
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.lineJoin = 'round';

      // 1. "Обучение по " — черный с белой обводкой
      ctx.strokeText(wall.part1, startX, 0);
      ctx.fillStyle = '#111';
      ctx.fillText(wall.part1, startX, 0);

      // 2. "Адвант Шоп" — ярко-синий с белой обводкой
      ctx.strokeText(wall.part2, startX + width1, 0);
      ctx.fillStyle = '#0088ff';
      ctx.fillText(wall.part2, startX + width1, 0);

      ctx.restore();
    }

    // Создание разбившегося яйца (скорлупа + статичный шлепок)
    function breakEgg(x, y) {
      // 1. Осколки скорлупы, разлетающиеся в стороны
      const shardCount = 8;
      for (let i = 0; i < shardCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 4 + 2;
        shards.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * force,
          vy: Math.sin(angle) * force - 2.5,
          size: Math.random() * 5 + 4,
          rot: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 0.25,
          gravity: 0.18
        });
      }

      // 2. Брызги белка
      const drops = [];
      for (let i = 0; i < 8; i++) {
        drops.push({
          ox: (Math.random() - 0.5) * 36,
          oy: (Math.random() - 0.5) * 36,
          r: Math.random() * 5 + 3
        });
      }

      // 3. Статичная клякса
      splats.push({
        x: x,
        y: y,
        drops: drops,
        dripLength: Math.random() * 12 + 10,
        dripAngleOffset: (Math.random() - 0.5) * 6
      });
    }

    // Главный цикл игры
    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Земля
      ctx.fillStyle = '#556B2F';
      ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

      // Стена
      drawWall();

      // Отрисовка клякс на стене
      splats.forEach(s => {
        // Белок (полупрозрачный)
        ctx.fillStyle = 'rgba(255, 255, 240, 0.72)';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 18, 0, Math.PI * 2);
        ctx.fill();

        // Капли белка вокруг
        s.drops.forEach(d => {
          ctx.beginPath();
          ctx.arc(s.x + d.ox, s.y + d.oy, d.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // Желток
        ctx.fillStyle = '#FFA500';
        ctx.beginPath();
        ctx.arc(s.x, s.y + 2, 9, 0, Math.PI * 2);
        ctx.fill();

        // Блик на желтке
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(s.x - 2, s.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Аккуратная маленькая статичная капелька под желтком
        ctx.strokeStyle = '#FFA500';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y + 9);
        ctx.lineTo(s.x + s.dripAngleOffset, s.y + 9 + s.dripLength);
        ctx.stroke();
      });

      // Осколки скорлупы
      for (let i = shards.length - 1; i >= 0; i--) {
        const sh = shards[i];
        sh.x += sh.vx;
        sh.y += sh.vy;
        sh.vy += sh.gravity;
        sh.rot += sh.vRot;

        ctx.save();
        ctx.translate(sh.x, sh.y);
        ctx.rotate(sh.rot);
        ctx.fillStyle = '#FAF0E6';
        ctx.strokeStyle = '#D2B48C';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -sh.size);
        ctx.lineTo(sh.size * 0.8, sh.size * 0.7);
        ctx.lineTo(-sh.size * 0.8, sh.size * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        if (sh.y > canvas.height + 20) {
          shards.splice(i, 1);
        }
      }

      // Полет яиц
      for (let i = eggs.length - 1; i >= 0; i--) {
        const egg = eggs[i];
        egg.x += egg.vx;
        egg.y += egg.vy;

        const distToTarget = Math.hypot(egg.targetX - egg.x, egg.targetY - egg.y);

        if (distToTarget < 15 || egg.y <= egg.targetY) {
          if (
            egg.x >= wall.x && egg.x <= wall.x + wall.w &&
            egg.y >= wall.y && egg.y <= wall.y + wall.h
          ) {
            breakEgg(egg.x, egg.y);
          }
          eggs.splice(i, 1);
          continue;
        }

        // Яйцо в воздухе
        ctx.save();
        ctx.translate(egg.x, egg.y);
        ctx.fillStyle = '#F5DEB3';
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 11, Math.atan2(egg.vy, egg.vx) + Math.PI / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#D2B48C';
        ctx.stroke();
        ctx.restore();
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
