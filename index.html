<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_ARCADE // Team Arcade Hub</title>
  <link rel="stylesheet" href="hub/hub.css">
</head>
<body>
  <div class="cyber-bg"></div>

  <header class="header">
    <div class="header-content">
      <div class="logo">
        <span class="logo-accent">CYBER</span>//ARCADE
        <span class="badge">DEV_TEAM</span>
      </div>
      <div class="system-status">
        <span class="status-dot"></span> SYSTEM_ONLINE
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 class="hero-title">Команда #69</h1>
      <p class="hero-desc">Выбирай симулятор, ставь рекорды, только недолго.</p>
    </section>

    <section class="games-grid" id="gamesGrid"></section>
  </main>

  <div class="game-modal" id="gameModal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-window">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <span class="modal-tag">ACTIVE_PROCESS</span>
          <h2 class="modal-game-title" id="modalTitle">Загрузка...</h2>
        </div>
        <button class="btn-close" id="btnCloseGame">✕ ВЫХОД [ESC]</button>
      </div>

      <div class="game-viewport" id="gameViewport"></div>

      <div class="modal-footer">
        <span id="gameControlsTip">Управление</span>
      </div>
    </div>
  </div>

  <script src="hub/hub.js"></script>
</body>
</html>
