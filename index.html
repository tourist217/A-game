<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Бросок яйца в стену</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      color: #eee;
      user-select: none;
      overflow: hidden;
    }
    canvas {
      border: 3px solid #444;
      background: #87CEEB; /* Небо */
      cursor: crosshair;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    p { margin-top: 10px; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <p>Кликайте мышкой по стене, чтобы бросать яйца!</p>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Параметры стены
    const wall = {
      x: 250,
      y: 100,
      w: 300,
      h: 300,
      part1: "Обучение по ",
      part2: "Адвант Шоп"
    };

    const eggs = [];
    const splats = [];   // Пятна, которые текут и высыхают
    const shards = [];   // Осколки скорлупы

    // Обработка клика
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const targetX = e.clientX - rect.left;
      const targetY = e.clientY - rect.top;

      const startX = canvas.width / 2;
      const startY = canvas.height - 20;

      const dx = targetX - startX;
      const dy = targetY - startY;
      const distance = Math.hypot(dx, dy);
      const speed = 16;

      eggs.push({
        x: startX,
        y: startY,
        vx: (dx / distance) * speed,
        vy: (dy / distance) * speed,
        targetX: targetX,
        targetY: targetY
      });
    });

    // Рисование кирпичной стены
    function drawWall() {
      ctx.fillStyle = '#b2533e';
      ctx.fillRect(wall.x, wall.y, wall.w, wall.h);

      // Кирпичные швы
      ctx.strokeStyle = '#7c2f20';
      ctx.lineWidth = 2;
      const rowH = 20;
      const colW = 40;
      for (let y = wall.y; y < wall.y + wall.h; y += rowH) {
        ctx.beginPath();
        ctx.moveTo(wall.x, y);
        ctx.lineTo(wall.x + wall.w, y);
        ctx.stroke();

        const offset = ((y - wall.y) / rowH) % 2 === 0 ? 0 : colW / 2;
        for (let x = wall.x + offset; x < wall.x + wall.w; x += colW) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, Math.min(y + rowH, wall.y + wall.h));
          ctx.stroke();
        }
      }

      // Карниз
      ctx.fillStyle = '#444';
      ctx.fillRect(wall.x - 10, wall.y - 10, wall.w + 20, 10);

      // Надпись
      ctx.save();
      ctx.font = 'bold 22px Arial, sans-serif';
      ctx.translate(wall.x + wall.w / 2, wall.y + wall.h / 2);
      ctx.rotate(-0.05);

      const width1 = ctx.measureText(wall.part1).width;
      const width2 = ctx.measureText(wall.part2).width;
      const totalWidth = width1 + width2;
      const startX = -totalWidth / 2;

      ctx.textAlign = 'left';

      // Белая окантовка текста
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.lineJoin = 'round';

      // 1. "Обучение по " — черный с белой обводкой
      ctx.strokeText(wall.part1, startX, 0);
      ctx.fillStyle = '#111';
      ctx.fillText(wall.part1, startX, 0);

      // 2. "Адвант Шоп" — ярко-синий с белой обводкой
      ctx.strokeText(wall.part2, startX + width1, 0);
      ctx.fillStyle = '#0088ff';
      ctx.fillText(wall.part2, startX + width1, 0);

      ctx.restore();
    }

    // Создание разбившегося яйца (клякса + осколки)
    function breakEgg(x, y) {
      // 1. Осколки скорлупы, разлетающиеся в стороны
      const shardCount = 8;
      for (let i = 0; i < shardCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 4 + 2;
        shards.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * force,
          vy: Math.sin(angle) * force - 2, // легкий подброс вверх
          size: Math.random() * 5 + 4,
          rot: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 0.2,
          gravity: 0.18
        });
      }

      // 2. Брызги белка вокруг эпицентра
      const drops = [];
      for (let i = 0; i < 7; i++) {
        drops.push({
          ox: (Math.random() - 0.5) * 40,
          oy: (Math.random() - 0.5) * 35,
          r: Math.random() * 5 + 3
        });
      }

      // 3. Объект пятна со сползанием
      splats.push({
        originX: x,
        originY: y,
        currentY: y,       // Текущая нижняя точка сползания
        speed: 0.55 + Math.random() * 0.45, // Скорость стекания
        age: 0,            // Возраст в кадрах
        maxAge: 240,       // За сколько кадров (~4 сек) полностью застынет
        drops: drops,
        dripXOffset: (Math.random() - 0.5) * 8
      });
    }

    // Главный цикл анимации
    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Земля
      ctx.fillStyle = '#556B2F';
      ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

      // Стена
      drawWall();

      // Ограничиваем рисование клякс областью стены (чтобы подтеки не вылезали за стену)
      ctx.save();
      ctx.beginPath();
      ctx.rect(wall.x, wall.y, wall.w, wall.h);
      ctx.clip();

      // Отрисовка клякс и сползания
      splats.forEach(s => {
        s.age++;

        // Пока не высохло — продолжаем плавно сползать вниз с затуханием
        if (s.age < s.maxAge && s.currentY < wall.y + wall.h - 5) {
          const friction = Math.max(0, 1 - (s.age / s.maxAge));
          s.currentY += s.speed * friction;
        }

        // Прогресс высыхания от 0 (свежее) до 1 (полностью засохло)
        const dryProgress = Math.min(1, s.age / s.maxAge);

        // Цвета: свежие яркие -> засохшие более темные и матовые
        const eggWhiteAlpha = 0.7 - dryProgress * 0.25;
        const yolkR = Math.round(255 - dryProgress * 35);
        const yolkG = Math.round(165 - dryProgress * 45);
        const yolkB = Math.round(0);

        // 1. Белок в месте удара
        ctx.fillStyle = `rgba(255, 255, 240, ${eggWhiteAlpha})`;
        ctx.beginPath();
        ctx.ellipse(s.originX, s.originY, 20, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        // Капли белка вокруг
        s.drops.forEach(d => {
          ctx.beginPath();
          ctx.arc(s.originX + d.ox, s.originY + d.oy, d.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // 2. След сползающего белка
        if (s.currentY > s.originY + 2) {
          ctx.fillStyle = `rgba(255, 255, 240, ${eggWhiteAlpha * 0.75})`;
          ctx.beginPath();
          ctx.moveTo(s.originX - 10, s.originY);
          ctx.lineTo(s.originX + 10, s.originY);
          ctx.lineTo(s.originX + s.dripXOffset + 4, s.currentY);
          ctx.lineTo(s.originX + s.dripXOffset - 4, s.currentY);
          ctx.closePath();
          ctx.fill();

          // Струйка желтка
          ctx.strokeStyle = `rgb(${yolkR}, ${yolkG}, ${yolkB})`;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(s.originX, s.originY + 4);
          ctx.lineTo(s.originX + s.dripXOffset, s.currentY);
          ctx.stroke();
        }

        // 3. Желток (стекает вместе с текущей точкой)
        ctx.fillStyle = `rgb(${yolkR}, ${yolkG}, ${yolkB})`;
        ctx.beginPath();
        ctx.arc(s.originX + s.dripXOffset, s.currentY, 8.5, 0, Math.PI * 2);
        ctx.fill();

        // Легкий блик на желтке (пока не засох)
        if (dryProgress < 0.8) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.beginPath();
          ctx.arc(s.originX + s.dripXOffset - 2, s.currentY - 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();

      // Осколки скорлупы
      for (let i = shards.length - 1; i >= 0; i--) {
        const sh = shards[i];
        sh.x += sh.vx;
        sh.y += sh.vy;
        sh.vy += sh.gravity;
        sh.rot += sh.vRot;

        // Рисуем кусочек скорлупы (треугольник)
        ctx.save();
        ctx.translate(sh.x, sh.y);
        ctx.rotate(sh.rot);
        ctx.fillStyle = '#FAF0E6';
        ctx.strokeStyle = '#D2B48C';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -sh.size);
        ctx.lineTo(sh.size * 0.8, sh.size * 0.7);
        ctx.lineTo(-sh.size * 0.8, sh.size * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Удаляем осколки, улетевшие за экран
        if (sh.y > canvas.height + 20) {
          shards.splice(i, 1);
        }
      }

      // Полет яиц
      for (let i = eggs.length - 1; i >= 0; i--) {
        const egg = eggs[i];
        egg.x += egg.vx;
        egg.y += egg.vy;

        const distToTarget = Math.hypot(egg.targetX - egg.x, egg.targetY - egg.y);

        if (distToTarget < 15 || egg.y <= egg.targetY) {
          // Если яйцо попало в стену
          if (
            egg.x >= wall.x && egg.x <= wall.x + wall.w &&
            egg.y >= wall.y && egg.y <= wall.y + wall.h
          ) {
            breakEgg(egg.x, egg.y);
          }
          eggs.splice(i, 1);
          continue;
        }

        // Отрисовка яйца в воздухе
        ctx.save();
        ctx.translate(egg.x, egg.y);
        ctx.fillStyle = '#F5DEB3';
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 11, Math.atan2(egg.vy, egg.vx) + Math.PI / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#D2B48C';
        ctx.stroke();
        ctx.restore();
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
