<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Racer: Splat Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #08090d;
      color: #ffffff;
      font-family: 'Consolas', monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      pointer-events: none;
      z-index: 10;
    }
    .score-box { color: #00f3ff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.7); }
    .lives-box { color: #ff1e42; text-shadow: 0 0 10px rgba(255, 30, 66, 0.7); }

    canvas {
      display: block;
      background: #11131a;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 7, 9, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
    }
    .overlay h2 {
      font-size: 2.2rem;
      color: #ff1e42;
      text-shadow: 0 0 15px rgba(255, 30, 66, 0.8);
    }
    .overlay p { color: #8e95a5; font-size: 0.95rem; }
    .btn-action {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ff1e42;
      padding: 10px 24px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(255, 30, 66, 0.4);
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #ff1e42;
      box-shadow: 0 0 20px rgba(255, 30, 66, 0.8);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="score-box">СЧЕТ: <span id="valScore">0</span></div>
    <div class="lives-box">ЖИЗНИ: <span id="valLives">❤❤❤</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="overlay" id="screenGameOver" style="display: none;">
    <h2>ФАТАЛЬНЫЙ СБОЙ!</h2>
    <p>Сбит важный тимлид с красным доступом. Проект закрыт.</p>
    <p style="color: #00f3ff;">Ликвидировано синих: <span id="valFinalScore">0</span></p>
    <button class="btn-action" id="btnRestart">ВЫЕХАТЬ СНОВА</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const valScore = document.getElementById('valScore');
    const valLives = document.getElementById('valLives');
    const screenGameOver = document.getElementById('screenGameOver');
    const valFinalScore = document.getElementById('valFinalScore');
    const btnRestart = document.getElementById('btnRestart');

    function resize() {
      canvas.width = Math.min(window.innerWidth, 500);
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let lives = 3;
    let isRunning = true;
    let baseSpeed = 2.0;
    let roadOffset = 0;
    let spawnCounter = 25;

    // Машина игрока
    const car = {
      w: 42,
      h: 74,
      x: canvas.width / 2 - 21,
      y: canvas.height - 110,
      speed: 5.5
    };

    const pedestrians = [];
    const bloodSplatters = [];
    const particles = [];     // Мелкие брызги
    const goreChunks = [];    // Крупные кувыркающиеся куски

    // Клавиатура
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Мышь / Тач
    let isPointerDown = false;
    window.addEventListener('pointerdown', e => {
      isPointerDown = true;
      moveCarToPointer(e);
    });
    window.addEventListener('pointermove', e => {
      if (isPointerDown) moveCarToPointer(e);
    });
    window.addEventListener('pointerup', () => isPointerDown = false);

    function moveCarToPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const targetX = e.clientX - rect.left - car.w / 2;
      car.x += (targetX - car.x) * 0.18;
    }

    function spawnPedestrian() {
      const isTarget = Math.random() > 0.45;
      pedestrians.push({
        x: 35 + Math.random() * (canvas.width - 70 - 32),
        y: -15,
        w: 30,
        h: 40,
        isTarget: isTarget,
        animFrame: Math.random() * 10
      });
    }

    // Физика расчленения при наезде
    function crushPedestrian(p) {
      const mainColor = p.isTarget ? '#0066ff' : '#ff1e42';
      const darkColor = p.isTarget ? '#003399' : '#880015';

      // 1. Пятно на асфальте с лужицами
      bloodSplatters.push({
        x: p.x + p.w / 2,
        y: p.y + p.h / 2,
        radiusX: 20 + Math.random() * 8,
        radiusY: 28 + Math.random() * 10,
        color: mainColor,
        blobs: Array.from({length: 4}, () => ({
          ox: (Math.random() - 0.5) * 26,
          oy: (Math.random() - 0.5) * 32,
          r: 4 + Math.random() * 6
        }))
      });

      // 2. Крупные кувыркающиеся ошмётки
      const chunkCount = 7 + Math.floor(Math.random() * 4);
      for (let i = 0; i < chunkCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 6;
        goreChunks.push({
          x: p.x + p.w / 2,
          y: p.y + p.h / 2,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 1, // лёгкий подброс вверх
          w: 8 + Math.random() * 10,
          h: 4 + Math.random() * 6,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.35, // вращение в полёте
          color: Math.random() > 0.3 ? mainColor : darkColor,
          life: 35 + Math.random() * 15,
          maxLife: 45
        });
      }

      // 3. Мелкие скоростные брызги
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 6;
        particles.push({
          x: p.x + p.w / 2,
          y: p.y + p.h / 2,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2 + Math.random() * 3.5,
          life: 25,
          color: mainColor
        });
      }
    }

    function update() {
      if (!isRunning) return;

      const currentSpeed = baseSpeed + Math.floor(score / 10) * 0.4;
      roadOffset = (roadOffset + currentSpeed) % 40;

      // Управление машиной
      if (keys['KeyA'] || keys['ArrowLeft']) car.x -= car.speed;
      if (keys['KeyD'] || keys['ArrowRight']) car.x += car.speed;
      if (keys['KeyW'] || keys['ArrowUp']) car.y -= car.speed * 0.7;
      if (keys['KeyS'] || keys['ArrowDown']) car.y += car.speed * 0.7;

      car.x = Math.max(16, Math.min(canvas.width - car.w - 16, car.x));
      car.y = Math.max(50, Math.min(canvas.height - car.h - 20, car.y));

      // Спавн
      spawnCounter++;
      const spawnRate = Math.max(45, 80 - Math.floor(score / 10) * 4);
      if (spawnCounter > spawnRate) {
        spawnPedestrian();
        spawnCounter = 0;
      }

      // Пятна на асфальте едут вниз со скоростью дороги
      for (let i = bloodSplatters.length - 1; i >= 0; i--) {
        const s = bloodSplatters[i];
        s.y += currentSpeed;
        if (s.y > canvas.height + 80) bloodSplatters.splice(i, 1);
      }

      // Обновление кусков и ошмётков
      for (let i = goreChunks.length - 1; i >= 0; i--) {
        const c = goreChunks[i];
        c.x += c.vx;
        c.y += c.vy + currentSpeed * 0.4;
        c.vx *= 0.94; // трение воздуха
        c.vy *= 0.94;
        c.rot += c.vRot;
        c.life--;
        if (c.life <= 0) goreChunks.splice(i, 1);
      }

      // Обновление брызг
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      // Пешеходы
      for (let i = pedestrians.length - 1; i >= 0; i--) {
        const p = pedestrians[i];
        p.y += currentSpeed;
        p.animFrame += 0.15;

        // Коллизия с машиной
        if (
          car.x < p.x + p.w &&
          car.x + car.w > p.x &&
          car.y < p.y + p.h &&
          car.y + car.h > p.y
        ) {
          crushPedestrian(p);

          if (p.isTarget) {
            score += 1;
            valScore.textContent = score;
          } else {
            lives--;
            valLives.textContent = '❤'.repeat(Math.max(0, lives));
            if (lives <= 0) {
              gameOver();
              return;
            }
          }

          pedestrians.splice(i, 1);
          continue;
        }

        if (p.y > canvas.height + 40) {
          pedestrians.splice(i, 1);
        }
      }
    }

    // Детальная отрисовка клерка
    function drawHuman(p) {
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      const legWobble = Math.sin(p.animFrame) * 4;
      const teamColor = p.isTarget ? '#0066ff' : '#ff1e42';

      // 1. Брюки и шагающие ноги
      ctx.strokeStyle = '#1e2230';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - 5, cy + 6);
      ctx.lineTo(cx - 5, cy + 16 + legWobble);
      ctx.moveTo(cx + 5, cy + 6);
      ctx.lineTo(cx + 5, cy + 16 - legWobble);
      ctx.stroke();

      // 2. Туловище: белая офисная рубашка
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 8, cy - 8, 16, 16);

      // Галстук цвета команды
      ctx.fillStyle = teamColor;
      ctx.beginPath();
      ctx.moveTo(cx - 2, cy - 6);
      ctx.lineTo(cx + 2, cy - 6);
      ctx.lineTo(cx + 3, cy + 2);
      ctx.lineTo(cx, cy + 5);
      ctx.lineTo(cx - 3, cy + 2);
      ctx.closePath();
      ctx.fill();

      // 3. Руки и чемоданчик (портфель) в правой руке
      ctx.strokeStyle = '#ffffff'; // белые рукава
      ctx.lineWidth = 3;
      ctx.beginPath();
      // Левая рука
      ctx.moveTo(cx - 8, cy - 6);
      ctx.lineTo(cx - 12, cy + 4 - legWobble);
      // Правая рука с портфелем
      ctx.moveTo(cx + 8, cy - 6);
      ctx.lineTo(cx + 12, cy + 4 + legWobble);
      ctx.stroke();

      // Чемоданчик
      ctx.fillStyle = '#4a2e18'; // коричневая кожа
      ctx.fillRect(cx + 10, cy + 4 + legWobble, 6, 8);

      // 4. Голова и прическа
      ctx.fillStyle = '#f7c59f'; // тон кожи
      ctx.beginPath();
      ctx.arc(cx, cy - 12, 6, 0, Math.PI * 2);
      ctx.fill();

      // Тёмные волосы сверху
      ctx.fillStyle = '#141419';
      ctx.beginPath();
      ctx.arc(cx, cy - 14, 6, Math.PI, Math.PI * 2);
      ctx.fill();

      // 5. Буква «А» на спине/груди
      ctx.font = '900 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeText('A', cx, cy - 1);

      ctx.fillStyle = teamColor;
      ctx.fillText('A', cx, cy - 1);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Дорожное полотно
      ctx.fillStyle = '#0e1017';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Неоновые отбойники по краям
      ctx.fillStyle = '#ff1e42';
      ctx.fillRect(0, 0, 8, canvas.height);
      ctx.fillRect(canvas.width - 8, 0, 8, canvas.height);

      // Прерывистая разметка
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -roadOffset;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // 1. Кровавые лужи и следы
      bloodSplatters.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.globalAlpha = 0.55;
        // Основное смазанное пятно
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.radiusX, s.radiusY, 0, 0, Math.PI * 2);
        ctx.fill();
        // Мелкие капли вокруг
        s.blobs.forEach(b => {
          ctx.beginPath();
          ctx.arc(s.x + b.ox, s.y + b.oy, b.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1.0;
      });

      // 2. Мелкие брызги
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // 3. Кувыркающиеся куски и ошмётки
      goreChunks.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        // Рисуем вытянутый неровный обрубок
        ctx.beginPath();
        ctx.ellipse(0, 0, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 4. Пешеходы
      pedestrians.forEach(p => drawHuman(p));

      // 5. Машина
      ctx.fillStyle = '#ff1e42';
      ctx.shadowColor = 'rgba(255, 30, 66, 0.6)';
      ctx.shadowBlur = 10;
      ctx.fillRect(car.x, car.y, car.w, car.h);
      ctx.shadowBlur = 0;

      // Лобовое стекло
      ctx.fillStyle = '#00f3ff';
      ctx.fillRect(car.x + 5, car.y + 16, car.w - 10, 14);

      // Фары
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(car.x + 4, car.y + 2, 7, 4);
      ctx.fillRect(car.x + car.w - 11, car.y + 2, 7, 4);

      // Колёса
      ctx.fillStyle = '#000000';
      ctx.fillRect(car.x - 3, car.y + 10, 4, 14);
      ctx.fillRect(car.x + car.w - 1, car.y + 10, 4, 14);
      ctx.fillRect(car.x - 3, car.y + car.h - 22, 4, 14);
      ctx.fillRect(car.x + car.w - 1, car.y + car.h - 22, 4, 14);
    }

    function loop() {
      update();
      draw();
      if (isRunning) requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      valFinalScore.textContent = score;
      screenGameOver.style.display = 'flex';
    }

    function restart() {
      score = 0;
      lives = 3;
      pedestrians.length = 0;
      bloodSplatters.length = 0;
      particles.length = 0;
      goreChunks.length = 0;
      car.x = canvas.width / 2 - car.w / 2;
      car.y = canvas.height - 110;
      valScore.textContent = '0';
      valLives.textContent = '❤❤❤';
      screenGameOver.style.display = 'none';
      isRunning = true;
      loop();
    }

    btnRestart.addEventListener('click', restart);
    loop();
  </script>
</body>
</html>
